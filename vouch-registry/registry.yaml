# Project Pulse v2 — Vouch Registry（准入规则被编译成 CI 的样本）
# Institutional Registry — 2026-10-29 ~ 11-03 队列评估 P0（第二次 P0，与前次不同轴）
#
# ---
# 制度定位
# 「收紧贡献入口」是 2026 年开源治理的主线之一，但绝大多数项目只把它写进
# CONTRIBUTING.md 的散文里 —— 规则存在，执行靠人，留痕为零。
# ghostty 是反例：准入规则被**编译成 CI**，名单本身成为可 fork 的制度资产。
#
# 这不是「某个项目很严格」的花边新闻，而是一次可测量的制度实验：
#   规则文本（AI_POLICY.md）→ 执行机制（5 个 vouch-* workflow）
#   → 状态数据（VOUCHED.td，408 行）→ 变更路径（discussion comment → bot → PR → merge）
# 四个环节全部公开、可 diff、可复算。这是目前极少数能做到这一点的准入治理样本。
#
# ---
# NIE 分析轴
institution:
  name: "ghostty-org/ghostty — vouch-based contribution gate"
  domain: "github.com/ghostty-org/ghostty"
  legal_form: "MIT，个人领导（Mitchell Hashimoto）+ org 化治理"
  model: "Allow-list（vouch）取代 deny-list；规则以 CI workflow 执行，名单以纯文本入库"
  scale_2026_11_03: "63,288★ / 3,826 fork / 258 open issues / 5,788 closed PR"

nie_axes:
  ostrom:
    score: 5
    signal: "自定规则 + 留痕执行 + 名单可被他人继承 —— Ostrom 的 collective-choice 与 graduated sanctions 同时落地"
    analysis: >
      这是本模块最强的一轴。Ostrom 关心的不是「有没有规则」，而是
      「规则由谁定、怎么被记录、违反后如何处置、其他人能不能复用」。
      ghostty 的 vouch 机制逐一对应：
      - 规则由维护者定：discussion 上打 `!vouch` / `!denounce` / `!unvouch`；
      - 处置分级：未 vouch 的 PR 被 check-pr 自动关闭（graduated sanction 的硬边界），
        被 denounce 的则「issues, PRs, etc. auto-closed」（更重一级）；
      - 留痕：每一次名单变更生成一个 bot PR（名字即 `Update VOUCHED list`），
        实测 15/15 样本 merged_by 全为 `ghostty-vouch[bot]`、review 评论 0 条 ——
        **合并动作无人类署名，但人类动作发生在 discussion 里**；
      - 可复用：VOUCHED.td 头部明文鼓励「other projects can slurp in our list … if they trust us」。
      最后一条是全新的：**排除名单第一次被设计成可移植的制度基础设施**。

  north:
    score: 4
    signal: "规则生命周期可测：政策文件自 2026-02-03 后未再修订，而名单以每周 ~2 次的频率在变"
    analysis: >
      一次完整的「规则文本 → 执行机制」的制度化过程在这里可以被计时：
      AI_POLICY.md 只有两次提交（2026-01-22 引入、2026-02-03 修订），
      此后政策文本稳定，而 VOUCHED.td 的变更从未停 —— 2026-10-25 至 11-02 十次提交、
      354 个已合并的名单 PR。规则定了就不动，状态天天在动，
      这正是「规则」与「执行」分离的标志。可测指标：规则修订间隔 vs 状态变更频率。

  williamson:
    score: 4
    signal: "把裁量权从人转移到 CI —— 交易成本的转移，而非消除"
    analysis: >
      Williamson 框架下，把「谁可以贡献」的判断从维护者的上下文判断搬到
      workflow 的确定性执行，是把治理成本从**判断成本**换成**名单维护成本**。
      代价是可测的：354 个名单 PR、每个新增一行、零评审。
      收益同样可测：未 vouch 的 PR 在同一次事件里被自动关闭，不再占用维护者时间。
      关键制度事实：**成本没有消失，只是从「每个人每次判断」变成「一个人持续记账」**，
      而记账的那个人是谁，从公开数据里查不到（bot 署名掩盖了人类动作）。

  acemoglu:
    score: 4
    signal: "denounced 名单 26/408，理由字段由维护者单方书写，无申诉通道，无到期机制"
    analysis: >
      包容性 vs 汲取性在准入层的直接读数。当前 26 条 denounced 记录中，
      理由字段呈现完整光谱，从高度可辩护的（`Repeated meatproxying in spite of prior warning`）
      到完全不可复核的（`Stupid bot cosplaying as a maintainer`、`automated vomit`、
      `Demonstrated indefensibly poor taste, judgement and AI steering capabilities`）。
      制度分析要指出的是结构而非措辞：
      ①理由写入者 = 判定者 = 唯一记账者，无第三方；
      ②名单公开且被鼓励复用 → 一次判定可能跨项目生效；
      ③无到期、无复审、无申诉字段 → 排除是永久的，且不可从公开数据知道是否曾被推翻。
      **这三条加总，使一个本用于防止 AI slop 的机制具备成为长期资格剥夺工具的形态。**
      项目方的自我说明（AI_POLICY.md「We love to help junior developers learn and grow,
      but if you're interested in that then don't use AI」）恰好承认了这个张力：
      被排除的人没有申诉路径，只有「别用 AI」这一条出路。

# 可复算指标（每次运行全部重算，不缓存结论）
metrics:
  vouched_count: "VOUCHED.td 中不带 '-' 前缀的数据行数"
  denounced_count: "VOUCHED.td 中带 '-' 前缀的数据行数"
  denounced_with_reason: "带 '-' 前缀且该行含空格后理由字段的条数"
  policy_ai_slop_related: "理由中含 AI/slop/bot/HITL/human 等词的条数"
  list_commit_freq_30d: "最近 30 天内 VOUCHED.td 的提交数"
  bot_merge_ratio: "抽样 PR 中 merged_by 含 bot 的比例"
  review_coverage: "抽样 PR 中含 review 或 comment 的比例"

# 数据源（2026-11-03 04:30-05:30 实测）
data_sources:
  vouched_file:
    url: "https://raw.githubusercontent.com/ghostty-org/ghostty/main/.github/VOUCHED.td"
    status: "available"
    measured: "200, 5,897 bytes, 428 行（408 数据行 + 20 注释行）"
    note: "位置是 .github/VOUCHED.td —— 队列转述为『一份 VOUCHED 名单』但未给路径，实测确认"
  workflows_dir:
    url: "https://api.github.com/repos/ghostty-org/ghostty/contents/.github/workflows"
    status: "available"
    measured: "15 个 workflow，其中 5 个 vouch-*：check-issue / check-pr / manage-by-discussion / manage-by-issue / sync-codeowners"
  check_pr_workflow:
    url: "https://raw.githubusercontent.com/ghostty-org/ghostty/main/.github/workflows/vouch-check-pr.yml"
    status: "available"
    note: "pull_request_target: [opened, reopened] → auto-close: true。执行器是 mitchellh/vouch@v1.5.0（第三方 action，pin 到 commit）"
  manage_by_discussion_workflow:
    url: "https://raw.githubusercontent.com/ghostty-org/ghostty/main/.github/workflows/vouch-manage-by-discussion.yml"
    status: "available"
    note: "discussion_comment: [created] → 关键字 !vouch / !denounce / !unvouch，merge-immediately: true"
  list_commits:
    url: "https://api.github.com/repos/ghostty-org/ghostty/commits?path=.github/VOUCHED.td"
    status: "available"
    measured: "最近 10 次提交全在 2026-10-25 ~ 11-02 之间"
  list_prs:
    url: "https://api.github.com/search/issues?q=repo:ghostty-org/ghostty+is:pr+%22Update+VOUCHED+list%22"
    status: "available"
    measured: "已合并 354 个；抽样 15 个，merged_by 全为 ghostty-vouch[bot]，review+comment 全为 0"
  ai_policy:
    url: "https://raw.githubusercontent.com/ghostty-org/ghostty/main/AI_POLICY.md"
    status: "available"
    measured: "200, 2,989 bytes；最后修订 2026-02-03（仅 2 次提交）"

# 已知的方法学边界（引用前必读）
caveats:
  - "VOUCHED.td 里既有 vouch（允许）也有 -denounce（排除），两者共用一个文件、一种语法，仅靠 '-' 前缀区分 —— 任何只数行数的分析会得到错误结论"
  - "名单变更的 PR 全部由 bot 合并，人类动作在 discussion 里，因此 `merged_by` 无法回答『谁做的决定』（与 Django 禁自合线索属同一平台层缺口）"
  - "denounced 理由字段不是结构化数据，是可自由书写的注释；编码只能做关键词匹配，不能当作分类事实"
  - "单一项目样本，不可外推到「开源社区普遍做法」"

# 待监控信号
signals_to_monitor:
  - "denounced 计数是否单向增长（当前 26）—— 若只增不减，排除即永久的判断成立"
  - "VOUCHED.td 是否出现『申诉后移除 - 前缀』的记录（从提交历史可查）"
  - "其他项目是否真的『slurp in』这份名单 —— 判据是在别的仓库搜 VOUCHED.td 的内容出处"
  - "vouch 机制是否被搬进 mitchellh/vouch 之外的实现（当前唯一执行器是单一第三方 action）"
  - "list commit 频率：从每周 ~2 次升到每日多次 = 门禁在收紧；归零 = 机制废弃"

# 优先级
priority: "P0"
rationale: >
  四轴典型（Ostrom 5 / North 4 / Williamson 4 / A&R 4），数据源全部公开可复算，
  与现有池零重叠（池内无任何『把准入规则编译成 CI』的样本）。
  且它把 2026 年三个分散线索接在一处：AI 披露（#228/#230）、
  外部贡献格关闭（ladybird）、平台层 merged_by 缺口（Django）。

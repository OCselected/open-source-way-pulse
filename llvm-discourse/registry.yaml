# Project Pulse v2 — LLVM Discourse Institutional Registry
# 第六个 P0。前五个 P0 的数据对象是 测量行为（oss-scanner / osv-origins）、
# 制度文本本体（ai-policy-registry）、规则被编译成 CI（vouch-registry）、
# 价格（bounty-ledger）、产权释出形式（release-regime）。
# 本模块处理的是「治理级版本化文本」—— 对已定稿的制度文本（LICENSE / 章程）
# 做文章级 diff，看它被如何修改、何时宣布终止执法。
# 与 llvm/ 模块的关系：llvm/ 取 GitHub 代码面（releases / commits / contributors），
# 本模块取 Discourse 文本面（政策帖 / 终止判据 / 名册变更公告）。两者互补不重叠。

source: discourse
provider: discourse-json
base_url: "https://discourse.llvm.org"
data_dir: data/llvm-discourse
rate_limit: 60/min
sync_script: llvm-discourse/source-sync.sh

# 分类 id 是稳定锚；slug 会重排（/c/announcements/8 的 8 现为 LLDB 分类）。
categories:
  - id: 46
    slug: announce
    name: Announcements
    topic_count: 395
    watch_level: high
    category: lifecycle
    description: "发布 / 大会 / CfP / RFC 公告 — 版本化释出节奏的一手时间线（LLVM 23.1.3→23.1.6 见 2026-10-06→11-17）"
  - id: 20
    slug: community
    name: Community
    topic_count: 412
    watch_level: high
    category: governance
    description: "治理级政策帖主渠道 — 重许可收尾、Board Meeting Minutes、安全响应组规则（vendor observer group）"

# 增量口径
increment:
  state: "topic_id 集合"
  signal: "新增 topic id = 新增文本；同名 topic 的 posts_count 上升 = 文本被修改"
  note: "Discourse 的 .json 不返回编辑历史；要判定「同一政策帖被改写」须按 topic id 取 /t/{id}.json 比对 posts 内容"

# 已知关键文本（引用前核对原文，不用媒体转述）
known_texts:
  - topic: "Wrapping Up LLVM's Relicensing Effort"
    created: 2026-11-19
    why: "八年重许可的收尾声明含「终止判据」——什么条件下不再要求带 SPDX 标识。这是 Ostrom 边界规则里「何时停止执法」的清晰样本"
  - topic: "[RFC] Adding a vendor observer group to the Security Response Group"
    created: 2026-09-16
    why: "安全响应组的准入层设计：观察席位（无表决）vs 成员席位 —— Williamson 混合治理的显式分层"

# 引用纪律
citation_rules:
  - "分类 id 46 的 About 置顶主题 created_at=2022-01-08，取「最新」必须按 created_at 排序，不能取数组首项"
  - "同一 slug 的路径不可靠：/c/announcements/8 已指向 LLDB；只用 /c/{id}.json"
  - "topic 的 created_at 是发帖时间，不等于最后修改时间；引用「某文本已更新」需带 last_posted_at"

# Project Pulse v2 — JDF Institutional Registry
# Joint Development Foundation (jointdevelopment.org)
# Status: METADATA ONLY — 2026-08-11
# 制度层注册，数据源待 2027 年补齐（JDF 页面 JS 渲染，当前不可自动化）
#
# ---
# 制度定位
# JDF 是 Linux Foundation 家族的一种新型托管制度形态：
#   法人实体 = Joint Development Foundation Projects, LLC（商业有限责任公司）
#   托管模型 = 每个项目 = 一个 "Series"（类有限合伙的多基金架构）
#   首个落地 = Appia Foundation（APPIA Series，2026-06）
#
# NIE 分析轴：Coase（企业边界）/ Williamson（混合治理）/ North（制度变迁）/ A&R（包容性）

---
institution:
  name: "Joint Development Foundation (JDF)"
  domain: "jointdevelopment.org"
  legal_form: "Joint Development Foundation Projects, LLC"
  founded: "2025"
  hosted_by: "Linux Foundation"
  model: "Multi-series LLC — each project is a separate 'Series'"
  first_project: "Appia Foundation (APPIA Series, 2026-06)"

# 制度分析
nie_axes:
  coase:
    score: 5
    signal: "为什么 AI 标准化要走 LLC 而非 501(c)(3)？→ 交易成本：系列结构让每个项目独立承担法律风险，共享 LF 基础设施"
    analysis: >
      JDF 是 Coase 企业边界问题的一次实证回答。
      传统开源基金会（ASF/PSF）是非营利 501(c)(3)，治理成本高、法律风险由整个实体承担。
      JDF 用 LLC 的 Series 结构，让每个项目独立承担法律风险——
      这是把"企业边界"从公司层级转移到项目层级的制度创新。

  williamson:
    score: 4
    signal: "LLC + LF 背书 = 市场治理与科层治理的混合形态"
    analysis: >
      JDF 本身是 LF 基础设施的一部分，但用商业实体托管。
      Appia 的"证据传递"（evidence pass-through）机制是 Williamson
      交易成本理论的直接应用：不重复评估，只传递证据，降低价值链上的
      重复交易成本。

  north:
    score: 3
    signal: "LF 推出 JDF = LF 自身治理模型的制度变迁"
    analysis: >
      LF 从"直接托管开源项目"转向"提供法人基础设施给行业联盟"，
      这是 LF 从开源基础设施提供商向标准化基础设施提供商的战略漂移。
      这是 North 意义上的制度变迁——一个既有的制度框架（LF）为了适应
      新环境（AI 治理需求）而进行的结构调整。

  acemoglu:
    score: 3
    signal: "成员 100% 企业，无社区、无学术、无独立开发者"
    analysis: >
      是否包容性取决于标准化是否开放且免费。
      Appia 标准公开、规范透明 → 制度是包容性的。
      但如果认证和评估变成付费排他 → 制度滑向汲取性。
      当前阶段是包容性，但存在向汲取性漂移的风险。

